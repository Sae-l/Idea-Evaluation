name: Release
# Run by pushing a tag like v3.1.0. Verifies, builds the packages and attaches them to a GitHub release.
on:
  push:
    tags: ["v*.*.*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Verify tag matches CHANGELOG
        run: |
          version="${GITHUB_REF_NAME#v}"
          grep -q "^## ${version}\b" CHANGELOG.md || { echo "CHANGELOG.md has no section '## ${version}'"; exit 1; }
      - run: python tests/run_all.py
      - name: Build release assets
        run: |
          mkdir -p release
          cp dist/*.skill release/
          (cd release && sha256sum *.skill > SHA256SUMS)
      - name: Extract release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="## ${version}" '$0 ~ "^"v"( |$)" {f=1; next} /^## / && f {exit} f' CHANGELOG.md > notes.md
          test -s notes.md || echo "See CHANGELOG.md" > notes.md
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          case "$GITHUB_REF_NAME" in *-*) flags="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" release/* --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag $flags

name: Release
# Run by pushing a tag like v3.1.0 or v3.1.0-beta.1 that points at a commit on main.
# Job 1 verifies and builds with read-only rights; job 2 only publishes the already-built files.
on:
  push:
    tags: ["v[0-9]*.[0-9]*.[0-9]*"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check tag format and branch
        env:
          TAG: ${{ github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]] || { echo "tag '$TAG' is not a semantic version"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "tag must point at a commit on main"; exit 1; }
      - name: Extract release notes from CHANGELOG
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          if grep -qF -- "## ${version} (unreleased)" CHANGELOG.md; then echo "CHANGELOG still says '(unreleased)' for ${version}"; exit 1; fi
          awk -v v="## ${version}" 'index($0,v)==1 && (length($0)==length(v) || substr($0,length(v)+1,1)==" ") {f=1; next} /^## / && f {exit} f' CHANGELOG.md > notes.md
          test -s notes.md || { echo "no CHANGELOG section '## ${version}'"; exit 1; }
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python tests/run_all.py
      - name: Collect release assets
        run: |
          mkdir release
          cp dist/*.skill release/
          (cd release && sha256sum *.skill > SHA256SUMS)
      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: |
            release/*
            notes.md
          if-no-files-found: error
  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          flags=""
          case "$TAG" in *-*) flags="--prerelease";; esac
          gh release create "$TAG" release/* --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes-file notes.md --verify-tag $flags

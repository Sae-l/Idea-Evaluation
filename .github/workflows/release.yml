name: Release
# Run from Actions > Release > Run workflow on branch main, with the version (for example 3.1.0 or 3.1.0-beta.2).
# Job 1 verifies and builds with read-only rights; job 2 creates a DRAFT release with the files attached.
# You review the draft under Releases and press Publish (this creates the tag). With immutable releases, files
# cannot be added after publishing, which is why the files are attached to the draft first.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the leading v, for example 3.1.0-beta.2"
        required: true
        type: string
permissions:
  contents: read
jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check version format and that the tag is free
        env:
          VERSION: ${{ inputs.version }}
        run: |
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]] || { echo "'$VERSION' is not a semantic version"; exit 1; }
          git rev-parse -q --verify "refs/tags/v${VERSION}" >/dev/null && { echo "tag v${VERSION} already exists (tags of published releases cannot be reused)"; exit 1; }
          echo "ok: v${VERSION} will be created from $GITHUB_SHA"
      - name: Extract release notes from CHANGELOG
        env:
          VERSION: ${{ inputs.version }}
        run: |
          version="$VERSION"
          if grep -qF -- "## ${version} (unreleased)" CHANGELOG.md; then echo "CHANGELOG still says '(unreleased)' for ${version}"; exit 1; fi
          awk -v v="## ${version}" 'index($0,v)==1 && (length($0)==length(v) || substr($0,length(v)+1,1)==" ") {f=1; next} /^## / && f {exit} f' CHANGELOG.md > notes.md
          test -s notes.md || { echo "no CHANGELOG section '## ${version}'"; exit 1; }
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python tests/run_all.py
      - name: Collect release assets
        run: |
          mkdir release
          cp dist/*.skill release/
          (cd release && sha256sum *.skill > SHA256SUMS)
      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: |
            release/*
            notes.md
          if-no-files-found: error
  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release
      - name: Create draft release with files attached
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          flags=""
          case "$VERSION" in *-*) flags="--prerelease";; esac
          gh release create "v${VERSION}" release/* --repo "$GITHUB_REPOSITORY" --title "v${VERSION}" --notes-file notes.md --target "$GITHUB_SHA" --draft $flags
          echo "Draft created. Open Releases, check the files, then press Publish."

